name: Build ISP Inventory Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ISP-Inventory-v1.8.4/**'
      - '.github/workflows/build-windows-installer.yml'

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check source files
        shell: pwsh
        run: |
          if (!(Test-Path 'ISP-Inventory-v1.8.4/BUILD-ONE-CLICK-INSTALLER.ps1')) {
            throw 'The editable v1.8.4 source folder is missing its build script.'
          }
          node --check 'ISP-Inventory-v1.8.4/server/index.js'
          node --check 'ISP-Inventory-v1.8.4/public/js/app.js'
          node --check 'ISP-Inventory-v1.8.4/desktop/main.js'
          node --check 'ISP-Inventory-v1.8.4/desktop/preload.js'

      - name: Build Windows installer from latest source
        shell: pwsh
        run: |
          Set-Location 'ISP-Inventory-v1.8.4'
          ./BUILD-ONE-CLICK-INSTALLER.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISP-Inventory-v1.8.4-Windows-Installer
          path: ISP-Inventory-v1.8.4/installer-output/*Setup*.exe
          if-no-files-found: error
          retention-days: 30
